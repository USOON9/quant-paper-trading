name: Offline tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Python ${{ matrix.python-version }} offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      ENABLE_ALPACA_PAPER: "NO"
      ENABLE_ALPACA_PAPER_ROUND_TRIP: "NO"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TZ: UTC
    steps:
      - name: Check out code without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e '.[ml,paper,data]'
      - name: Check publication candidates and the complete checkout index
        run: |
          python scripts/check_publish_secrets.py --mode candidates
          python scripts/check_publish_secrets.py --mode staged
      - name: Run synthetic and mocked tests
        run: python -m unittest discover -s tests -v
      - name: Check the launcher help without running a strategy
        run: python main.py --help
